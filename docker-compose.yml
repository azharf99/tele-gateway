services:
  tele-gateway:
    # build: .
    image: azharfa/tele-gateway:latest
    container_name: tele-gateway
    restart: always
    ports:
      - "8085:8080"
    environment:
      # Telegram API Credentials (will be overridden by .env file)
      - TZ=Asia/Jakarta
      - TELEGRAM_APP_ID=${TELEGRAM_APP_ID}
      - TELEGRAM_APP_HASH=${TELEGRAM_APP_HASH}
      - TELEGRAM_SESSION_FILE=/app/session/session.json
      - TELEGRAM_SESSION_DIR=/app/session
      - PHONE_NUMBER=${PHONE_NUMBER}
      - PASSWORD=${PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GIN_MODE=${GIN_MODE}

      # Database Configuration (Connect to your gothub_db container)
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}

      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

      # AI Configuration
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # B2B & Optional Watchdog Configuration
      - B2B_API_KEYS=${B2B_API_KEYS}
      - WATCHDOG_TARGET_URL=${WATCHDOG_TARGET_URL}
      - WATCHDOG_HEALTH_TOKEN=${WATCHDOG_HEALTH_TOKEN}
      - WATCHDOG_INTERVAL_SECONDS=${WATCHDOG_INTERVAL_SECONDS:-60}
      - WATCHDOG_FAIL_THRESHOLD=${WATCHDOG_FAIL_THRESHOLD:-2}
      - WATCHDOG_SERVICE_NAME=${WATCHDOG_SERVICE_NAME:-wa-gateway}
      - WATCHDOG_ALERT_CHAT_ID=${WATCHDOG_ALERT_CHAT_ID:-0}
      - WATCHDOG_ALERT_TOPIC_ID=${WATCHDOG_ALERT_TOPIC_ID:-0}
      - WATCHDOG_ALERT_USERNAME=${WATCHDOG_ALERT_USERNAME}
    volumes:
      - ./session:/app/session
      - .env:/app/.env
    networks:
      - shared-network
    stdin_open: true # Required for interactive OTP entry
    tty: true # Required for interactive OTP entry

networks:
  shared-network:
    external: true
    name: shared-network
